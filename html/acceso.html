<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceder · Ademass</title>
<link rel="stylesheet" href="../Css/acceso.css">
</head>
<body>
 
<canvas id="bg-canvas"></canvas>
 
<div class="card">
 
  <div class="logo-row">
    <svg width="46" height="40" viewBox="0 0 46 40" fill="none">
      <path d="M18 2L34 36H2L18 2Z" stroke="#3fa9be" stroke-width="5.5" stroke-linejoin="round"/>
      <path d="M35 4H30.5C25.7 4 22 8 22 13.5V26.5C22 32 25.7 36 30.5 36H35C40.5 36 44 31.8 44 20C44 8.2 40.5 4 35 4Z" fill="#c3d92e"/>
      <path d="M30.5 9.5H33.6C36.6 9.5 38.5 12.5 38.5 20C38.5 27.5 36.6 30.5 33.6 30.5H30.5C28.6 30.5 27.5 28.4 27.5 25.5V14.5C27.5 11.6 28.6 9.5 30.5 9.5Z" fill="#f7f8f6"/>
    </svg>
    <span class="wordmark">Ademass</span>
  </div>
  <div class="tagline">Training Development</div>
 
  <div class="title-row">
    <h1>Acceder</h1>
    <span class="bar"></span>
  </div>
  <p class="subtitle">Ingresa tus datos para continuar en el Campus.</p>
 
  <form>
    <div class="field">
      <label for="email">Email</label>
      <div class="input-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3fa9be" stroke-width="2"><path d="M3 6l9 7 9-7"/><rect x="3" y="4" width="18" height="16" rx="2"/></svg>
        <input type="email" id="email" placeholder="ejemplo@ademass.com" required>
      </div>
    </div>
 
    <div class="field">
      <label for="password">Contraseña</label>
      <div class="input-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3fa9be" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
    </div>
 
    <div class="row-between">
      <label class="remember">
        <input type="checkbox">
        Recordarme
      </label>
    </div>
 
    <button type="submit" class="btn-entrar">Entrar</button>
  </form>
 
  <div class="footer-links">
    <a href="#">Aún no tengo cuenta, registrarme</a>
    <span class="sep">·</span>
    <a href="../Index.html">Volver a inicio</a>
    <span class="sep">·</span>
    <a href="#">Olvidé mi contraseña</a>
  </div>
 
</div>

<script>
(function(){
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let w, h, dpr;
  const mouse = { x: -9999, y: -9999 };

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  window.addEventListener('resize', resize);

  window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });
  window.addEventListener('touchmove', e => {
    if(e.touches[0]){ mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
  }, {passive:true});

  const colors = ['rgba(63,169,190,ALPHA)', 'rgba(195,217,46,ALPHA)'];

  function makeTri(){
    const size = 14 + Math.random()*30;
    return {
      x: Math.random()*w,
      y: Math.random()*h,
      baseX: 0, baseY: 0,
      size,
      rot: Math.random()*Math.PI*2,
      spin: (Math.random()-0.5)*0.004,
      vx: (Math.random()-0.5)*0.15,
      vy: (Math.random()-0.5)*0.15,
      alpha: 0.05 + Math.random()*0.11,
      color: colors[Math.random() < 0.6 ? 0 : 1]
    };
  }

  const count = Math.round((w*h)/26000);
  const tris = Array.from({length: Math.max(18, Math.min(count, 46))}, makeTri);

  function drawTri(t){
    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.rotate(t.rot);
    ctx.beginPath();
    ctx.moveTo(0, -t.size);
    ctx.lineTo(t.size*0.87, t.size*0.5);
    ctx.lineTo(-t.size*0.87, t.size*0.5);
    ctx.closePath();
    ctx.fillStyle = t.color.replace('ALPHA', t.alpha);
    ctx.fill();
    ctx.restore();
  }

  function tick(){
    ctx.clearRect(0,0,w,h);

    for(const t of tris){
      t.x += t.vx;
      t.y += t.vy;
      t.rot += t.spin;

      if(t.x < -60) t.x = w+60;
      if(t.x > w+60) t.x = -60;
      if(t.y < -60) t.y = h+60;
      if(t.y > h+60) t.y = -60;

      const dx = t.x - mouse.x;
      const dy = t.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const radius = 170;
      if(dist < radius){
        const force = (1 - dist/radius) * 1.1;
        t.x += (dx/(dist||1)) * force;
        t.y += (dy/(dist||1)) * force;
      }

      drawTri(t);
    }

    requestAnimationFrame(tick);
  }
  tick();
})();
</script>

</body>
</html>
